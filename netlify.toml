[build]
  publish = "public"
  functions = "netlify/functions"
  # completa o endereço da imagem de pré-visualização do link (og:image) com o endereço do site
  command = "node scripts/set-site-url.js"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# o front chama /api/..., que vira a função netlify/functions/api.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
